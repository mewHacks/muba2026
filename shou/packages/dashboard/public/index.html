<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SHOU — guardian</title>
<style>
  :root{
    --bg:#f6f7f9;--card:#fff;--ink:#12151a;--muted:#5d6674;--line:#e3e6ea;--accent:#1f6feb;
    --ok:#0f7b4f;--okbg:#e8f6ef;--warn:#8a5800;--warnbg:#fdf3e0;--bad:#b3261e;--badbg:#fdecea;--r:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{padding:20px 28px;background:var(--card);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{margin:0;font-size:26px;letter-spacing:-.02em}
  .tag{color:var(--muted);font-size:15px}
  .chips{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
  .chip{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:#eef1f5;border:1px solid var(--line);
    border-radius:999px;padding:3px 10px;color:var(--muted)}
  main{max-width:820px;margin:0 auto;padding:20px 28px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
  h2{margin:0 0 12px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .req{border-left:4px solid var(--line)}
  .req.HOLD{border-left-color:var(--bad)}
  .req.WAIT{border-left-color:var(--warn)}
  .req.CLEAR{border-left-color:var(--ok)}
  .req.DONE{border-left-color:var(--line);opacity:.66}
  .amount{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .amount small{font-size:15px;font-weight:600;color:var(--muted);margin-left:5px}
  .headline{font-size:19px;line-height:1.4;margin:10px 0 0}
  .to{margin-top:8px;font-size:14px;color:var(--muted)}
  .to code{font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace;background:#f2f4f7;
    border:1px solid var(--line);border-radius:6px;padding:1px 6px}
  .state{display:inline-block;font-size:12px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;
    border-radius:999px;padding:4px 11px;margin-bottom:4px}
  .state.HOLD{background:var(--badbg);color:var(--bad)}
  .state.WAIT{background:var(--warnbg);color:var(--warn)}
  .state.CLEAR{background:var(--okbg);color:var(--ok)}
  .state.DONE{background:#eef1f5;color:var(--muted)}
  .consequence{margin-top:12px;font-size:14.5px;color:var(--muted);background:#f8f9fb;
    border:1px solid var(--line);border-radius:10px;padding:11px 13px}
  .escalated{margin-top:10px;font-size:13.5px;color:var(--warn);background:var(--warnbg);
    border:1px solid #f0dcb4;border-radius:9px;padding:8px 11px}
  .actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
  button{font:inherit;font-weight:600;border-radius:11px;padding:13px 18px;cursor:pointer;border:1px solid transparent}
  button:disabled{opacity:.5;cursor:default}
  button.block{background:var(--bad);color:#fff;flex:1 1 220px}
  button.approve{background:#fff;color:var(--ink);border-color:var(--line);flex:1 1 180px}
  button.approve:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .meta{margin-top:13px;font-size:12px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    word-break:break-all}
  .err{background:var(--badbg);border:1px solid #f3c9c5;color:var(--bad)}
  .note{font-size:13.5px;color:var(--muted)}
  .empty{text-align:center;padding:34px 18px;color:var(--muted)}
  .empty .big{font-size:19px;color:var(--ink);margin-bottom:6px}
  .hidden{display:none}
  .spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line);
    border-top-color:var(--accent);border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>SHOU</h1>
    <span class="tag" id="tag">Money your mother is trying to send, and what you can do about it.</span>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main>
  <div id="error" class="card err hidden"></div>
  <div id="notApprover" class="card hidden" style="border-color:#f0dcb4;background:var(--warnbg)"></div>
  <div id="list"><div class="card"><span class="spin"></span> Reading the chain…</div></div>
  <p class="note" id="footnote"></p>
</main>
<script type="module" src="/app.js"></script>
</body>
</html>
